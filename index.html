<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.screen {
    width: 90%;
    max-width: 520px;
}

.hidden {
    display: none !important;
}

.question {
    font-size: 23px;
    margin-bottom: 18px;
    line-height: 1.4;
}

input {
    width: 250px;
    max-width: 90%;
    padding: 12px;

    background: #000;
    color: #fff;

    border: 1px solid #fff;

    text-align: center;
    font-size: 18px;
    outline: none;
}

button {
    padding: 12px 28px;
    margin: 8px 4px;

    background: #fff;
    color: #000;

    border: none;
    border-radius: 2px;

    font-size: 17px;

    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
}

button:hover {
    opacity: 0.8;
}

button:disabled {
    opacity: 0.5;
    cursor: default;
}

.hint {
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.6;
    opacity: 0.7;
}

.emoji {
    font-size: 52px;
    margin-bottom: 18px;
}

.buttons {
    margin-top: 22px;
}

.result {
    margin-top: 25px;
    font-size: 20px;
    line-height: 1.6;
}

#hintButton {
    display: none;
}
</style>
</head>

<body>

<!-- ============================= -->
<!-- ПЕРШИЙ ЕКРАН -->
<!-- ============================= -->

<div id="passwordScreen" class="screen">

    <div class="question">
        Пароль
    </div>

    <input
        id="passwordInput"
        type="password"
        autocomplete="off"
    >

    <br>

    <button type="button" onclick="checkMainPassword()">
        →
    </button>

    <br>

    <button
        id="hintButton"
        type="button"
        onclick="startHint()"
    >
        Підказка
    </button>

</div>


<!-- ============================= -->
<!-- ПІДКАЗКА -->
<!-- ============================= -->

<div id="hintScreen" class="screen hidden">

    <div id="hintText" class="question">
        Точно хочеш підказку?
    </div>

    <button type="button" onclick="hintAnswer()">
        Так
    </button>

</div>


<!-- ============================= -->
<!-- ВІКТОРИНА -->
<!-- ============================= -->

<div id="quizScreen" class="screen hidden">

    <div id="question" class="question"></div>

    <div id="questionHint" class="hint"></div>

    <input
        id="answerInput"
        type="text"
        autocomplete="off"
    >

    <br>

    <button type="button" onclick="checkAnswer()">
        →
    </button>

    <div id="answerMessage" class="hint"></div>

</div>


<!-- ============================= -->
<!-- 26 / 16 -->
<!-- ============================= -->

<div id="numberScreen" class="screen hidden">

    <div class="question">
        Яке число тобі подобається?
    </div>

    <div id="numberError" class="hint"></div>

    <div class="buttons">

        <button
            id="button26"
            type="button"
            onclick="chooseNumber('26')"
        >
            26
        </button>

        <button
            id="button16"
            type="button"
            onclick="chooseNumber('16')"
        >
            16
        </button>

    </div>

</div>


<!-- ============================= -->
<!-- ПІСЛЯ 26 -->
<!-- ============================= -->

<div id="successNumberScreen" class="screen hidden">

    <div class="emoji">
        😊
    </div>

    <div class="question">
        День рождения
    </div>

    <div class="hint">
        Первые два символа — месяц,<br>
        вторые два — день
    </div>

    <div style="margin-top:25px;">

        <div>
            Пароль
        </div>

        <input
            id="birthdayPassword"
            type="password"
            autocomplete="off"
        >

        <br>

        <button type="button" onclick="checkBirthdayPassword()">
            →
        </button>

    </div>

</div>


<!-- ============================= -->
<!-- ПІСЛЯ 16 -->
<!-- ============================= -->

<div id="failNumberScreen" class="screen hidden">

    <div class="emoji">
        😔
    </div>

    <div class="question">
        Жаль что так, я думаю тебе не нужна знать пароль
    </div>

</div>


<!-- ============================= -->
<!-- ФІНАЛ -->
<!-- ============================= -->

<div id="finalScreen" class="screen hidden">

    <div class="question">
        Хто на самом деле главний герой
    </div>

    <div id="finalButtons" class="buttons">

        <button
            type="button"
            onclick="chooseFinal('Настя')"
        >
            Настя
        </button>

        <button
            type="button"
            onclick="chooseFinal('Ми')"
        >
            Ми
        </button>

        <button
            type="button"
            onclick="chooseFinal('Льоша')"
        >
            Льоша
        </button>

    </div>

    <div id="finalResult" class="result"></div>

</div>


<script>

/* =========================================
   SUPABASE
   ========================================= */

const SUPABASE_URL =
    "https://qwrwlopovbxvgxqdglae.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_O_prUGifjG5bX9DzOmUI4Q_KUVBJh24";


/* =========================================
   ПАРОЛЬ
   ========================================= */

const MAIN_PASSWORD = "1221";


/* =========================================
   ПИТАННЯ
   ========================================= */

const questions = [

    {
        question: "Маленькая, милая, белая собачка",
        answer: "Лилу",
        hint:
            "Подказка: це ім'я собаки. 4 символи, з великої букви."
    },

    {
        question: "Найкраща машина у світі",
        answer: "AO3535EI",
        hint:
            "Підказка: це номер машини. 8 символів, без пробілів. Відповідь англійською, великими літерами та цифрами."
    }

];


let currentQuestion = 0;
let hintStep = 0;
let finalChoiceInProgress = false;


/* =========================================
   ID БРАУЗЕРА
   ========================================= */

function getVisitorId() {

    let id = localStorage.getItem("visitor_id");

    if (!id) {

        if (window.crypto && crypto.randomUUID) {
            id = crypto.randomUUID();
        } else {
            id =
                Date.now().toString() +
                Math.random().toString(16).slice(2);
        }

        localStorage.setItem("visitor_id", id);
    }

    return id;
}


const visitorId = getVisitorId();


/* =========================================
   ПЕРЕМИКАННЯ ЕКРАНІВ
   ========================================= */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.add("hidden");
        });

    const screen = document.getElementById(id);

    if (screen) {
        screen.classList.remove("hidden");
    }
}


/* =========================================
   ОТРИМАТИ ЗАПИС ІЗ SUPABASE
   ========================================= */

async function getData() {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/choices" +
            "?singleton=eq.true" +
            "&select=id,number_choice,choice,singleton" +
            "&limit=1",
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {
            console.error(await response.text());
            return null;
        }

        const data = await response.json();

        return data.length ? data[0] : null;

    } catch (error) {

        console.error(error);
        return null;
    }
}


/* =========================================
   ПЕРШИЙ ПАРОЛЬ
   ========================================= */

async function checkMainPassword() {

    const input =
        document.getElementById("passwordInput");

    const password =
        input.value.trim();

    if (password === MAIN_PASSWORD) {

        const data = await getData();

        /*
           Якщо вже вибрано 16
        */

        if (
            data &&
            data.number_choice === "16"
        ) {

            showScreen("failNumberScreen");
            return;
        }


        /*
           Якщо фінальний вибір уже зроблено
        */

        if (
            data &&
            data.choice &&
            data.choice.trim() !== ""
        ) {

            showFinalResult(data.choice);
            return;
        }


        /*
           Правильний пароль —
           одразу фінальний екран
        */

        showScreen("finalScreen");
        return;
    }


    /*
       Неправильний пароль
    */

    input.value = "";

    document
        .getElementById("hintButton")
        .style.display = "inline-block";
}


/* =========================================
   ПІДКАЗКА
   ========================================= */

function startHint() {

    hintStep = 0;

    document
        .getElementById("hintText")
        .innerText =
        "Точно хочеш підказку?";

    showScreen("hintScreen");
}


function hintAnswer() {

    hintStep++;

    const text =
        document.getElementById("hintText");

    if (hintStep === 1) {

        text.innerText =
            "Точно-точно?";

        return;
    }

    if (hintStep === 2) {

        text.innerText =
            "Ну добре...";

        return;
    }

    /*
       Після трьох підтверджень —
       починаємо вікторину
    */

    currentQuestion = 0;

    showQuestion();

    showScreen("quizScreen");
}


/* =========================================
   ПОКАЗАТИ ПИТАННЯ
   ========================================= */

function showQuestion() {

    const q = questions[currentQuestion];

    document
        .getElementById("question")
        .innerText =
        q.question;

    document
        .getElementById("questionHint")
        .innerText =
        q.hint;

    document
        .getElementById("answerMessage")
        .innerText = "";

    document
        .getElementById("answerInput")
        .value = "";

    document
        .getElementById("answerInput")
        .focus();
}


/* =========================================
   ПЕРЕВІРКА ВІДПОВІДІВ
   ========================================= */

function checkAnswer() {

    const input =
        document
            .getElementById("answerInput")
            .value
            .trim();

    const correct =
        questions[currentQuestion].answer;

    /*
       Для другого питання —
       без урахування регістру.
    */

    if (
        input.toUpperCase() ===
        correct.toUpperCase()
    ) {

        currentQuestion++;

        if (
            currentQuestion >=
            questions.length
        ) {

            showScreen("numberScreen");
            return;
        }

        showQuestion();
        return;
    }


    /*
       Неправильна відповідь
    */

    document
        .getElementById("answerMessage")
        .innerText =
        "Не зовсім 🙂 Спробуй ще раз.";
}


/* =========================================
   ВИБІР 26 / 16
   ========================================= */

async function chooseNumber(number) {

    const button26 =
        document.getElementById("button26");

    const button16 =
        document.getElementById("button16");

    button26.disabled = true;
    button16.disabled = true;

    const errorBox =
        document.getElementById("numberError");

    errorBox.innerText = "";


    /*
       Перевіряємо,
       чи вже є глобальний вибір
    */

    const existing = await getData();

    if (
        existing &&
        existing.number_choice
    ) {

        if (
            existing.number_choice === "26"
        ) {

            showScreen(
                "successNumberScreen"
            );

        } else {

            showScreen(
                "failNumberScreen"
            );
        }

        return;
    }


    try {

        /*
           ВАЖЛИВО:
           choice = "" замість null.

           У твоїй базі choice має NOT NULL,
           тому null дав помилку 23502.
        */

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/choices",
            {
                method: "POST",

                headers: {
                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=representation"
                },

                body: JSON.stringify({

                    id: visitorId,

                    number_choice:
                        String(number),

                    choice: "",

                    singleton: true
                })
            }
        );


        if (!response.ok) {

            const existingAfterError =
                await getData();

            if (
                existingAfterError &&
                existingAfterError.number_choice
            ) {

                if (
                    existingAfterError.number_choice ===
                    "26"
                ) {

                    showScreen(
                        "successNumberScreen"
                    );

                } else {

                    showScreen(
                        "failNumberScreen"
                    );
                }

                return;
            }


            console.error(
                "Supabase error:",
                await response.text()
            );

            errorBox.innerText =
                "Не вдалося зберегти вибір.";

            button26.disabled = false;
            button16.disabled = false;

            return;
        }


        /*
           Все добре
        */

        if (String(number) === "26") {

            showScreen(
                "successNumberScreen"
            );

        } else {

            showScreen(
                "failNumberScreen"
            );
        }


    } catch (error) {

        console.error(error);

        errorBox.innerText =
            "Помилка підключення до бази.";

        button26.disabled = false;
        button16.disabled = false;
    }
}


/* =========================================
   ПАРОЛЬ ПІСЛЯ 26
   ========================================= */

async function checkBirthdayPassword() {

    const input =
        document
            .getElementById("birthdayPassword");

    const password =
        input.value.trim();


    if (password !== MAIN_PASSWORD) {

        input.value = "";

        return;
    }


    const data = await getData();


    if (
        data &&
        data.number_choice === "26"
    ) {

        if (
            data.choice &&
            data.choice.trim() !== ""
        ) {

            showFinalResult(data.choice);

        } else {

            showScreen("finalScreen");
        }
    }
}


/* =========================================
   ФІНАЛЬНИЙ ВИБІР
   ========================================= */

async function chooseFinal(choice) {

    if (finalChoiceInProgress) {
        return;
    }

    finalChoiceInProgress = true;


    /*
       Перевіряємо базу
    */

    const existing = await getData();


    /*
       Якщо вибір уже був —
       просто показуємо його
    */

    if (
        existing &&
        existing.choice &&
        existing.choice.trim() !== ""
    ) {

        showFinalResult(
            existing.choice
        );

        return;
    }


    /*
       Фінальний вибір дозволений
       тільки після 26
    */

    if (
        !existing ||
        existing.number_choice !== "26"
    ) {

        finalChoiceInProgress = false;
        return;
    }


    try {

        /*
           Оновлюємо єдиний запис.
        */

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/choices" +
            "?singleton=eq.true",
            {
                method: "PATCH",

                headers: {

                    "apikey": SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=representation"
                },

                body: JSON.stringify({
                    choice: choice
                })
            }
        );


        if (!response.ok) {

            console.error(
                "Supabase update error:",
                await response.text()
            );

            finalChoiceInProgress = false;

            return;
        }


        const updated = await getData();


        if (
            updated &&
            updated.choice
        ) {

            showFinalResult(
                updated.choice
            );

        } else {

            finalChoiceInProgress = false;
        }


    } catch (error) {

        console.error(error);

        finalChoiceInProgress = false;
    }
}


/* =========================================
   ФІНАЛЬНА ВІДПОВІДЬ
   ========================================= */

function showFinalResult(choice) {

    showScreen("finalScreen");

    document
        .getElementById("finalButtons")
        .classList.add("hidden");

    document
        .getElementById("finalResult")
        .innerText =
        "Ти обрала: " + choice + " ❤️";
}


/* =========================================
   ENTER НА КЛАВІАТУРІ
   ========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key !== "Enter") {
            return;
        }

        const passwordScreen =
            document.getElementById(
                "passwordScreen"
            );

        const quizScreen =
            document.getElementById(
                "quizScreen"
            );

        const birthdayScreen =
            document.getElementById(
                "successNumberScreen"
            );


        if (
            !passwordScreen.classList.contains(
                "hidden"
            )
        ) {

            checkMainPassword();
            return;
        }


        if (
            !quizScreen.classList.contains(
                "hidden"
            )
        ) {

            checkAnswer();
            return;
        }


        if (
            !birthdayScreen.classList.contains(
                "hidden"
            )
        ) {

            checkBirthdayPassword();
        }
    }
);

</script>

</body>
</html>
